<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>目前離線 - 台南資料</title>
  <link rel="icon" href="/pwa/icons/icon-192.png">
  <style>
    :root { --bg:#f5f6ff; --fg:#1f2340; --muted:#5d6385; --card:#fff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#12142a; --fg:#eceeff; --muted:#a3a8cc; --card:#1c1f3d; } }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      padding-top:max(24px, env(safe-area-inset-top)); padding-bottom:max(24px, env(safe-area-inset-bottom));
      background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }
    .box { max-width:420px; width:100%; text-align:center; background:var(--card); border-radius:24px; padding:36px 28px;
           box-shadow:0 12px 40px rgba(79,70,229,.18); }
    img { width:84px; height:84px; border-radius:20px; }
    h1 { font-size:1.4rem; margin:18px 0 8px; }
    p { color:var(--muted); line-height:1.7; margin:0 0 22px; }
    button { font:inherit; font-weight:600; color:#fff; border:0; border-radius:14px; padding:12px 26px; cursor:pointer;
             background:linear-gradient(135deg,#4f46e5,#14b8a6); }
    button:active { transform:scale(.98); }
  </style>
</head>
<body>
  <main class="box">
    <img src="/pwa/icons/icon-192.png" alt="">
    <h1>目前沒有網路連線</h1>
    <p>資料需要即時從台南市政府資料開放平台下載。<br>請確認網路後再試一次。</p>
    <button onclick="location.href='/'">重新整理</button>
  </main>
  <script>window.addEventListener('online', () => location.href = '/');</script>
</body>
</html>
